name: Release macOS arm64 CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TARGET: aarch64-apple-darwin

jobs:
  build_and_package:
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.identity.outputs.archive }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json, sys
          packages = json.load(sys.stdin)["packages"]
          print(next(package["version"] for package in packages if package["name"] == "eplyx-engine"))
          ')"
          release_tag="v${version}"
          archive="eplyx-${release_tag}-${RELEASE_TARGET}.tar.gz"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match eplyx-engine package version ${version}" >&2
            exit 1
          fi

          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "${host}" != "${RELEASE_TARGET}" ]]; then
            echo "runner host ${host} is not the supported release target ${RELEASE_TARGET}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          rustc -vV
          cargo --version

      - name: Build CLI from the checked-out commit
        env:
          EPLYX_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p eplyx-engine --target "$RELEASE_TARGET"

      - name: Verify binary identity and launch
        env:
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          binary="target/${RELEASE_TARGET}/release/eplyx"
          "$binary" version --json > "$RUNNER_TEMP/release-version.json"
          "$binary" --help > /dev/null
          python3 - "$RUNNER_TEMP/release-version.json" "$PACKAGE_VERSION" "$GITHUB_SHA" "$RELEASE_TARGET" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected_version, expected_commit, expected_target = sys.argv[2:]
          assert report["version"] == expected_version, report
          assert report["engine"]["version"] == expected_version, report
          assert report["commit"] == expected_commit, report
          assert report["target"] == expected_target, report
          assert report["os"] == "macos", report
          assert report["architecture"] == "aarch64", report
          PY

      - name: Smoke-test the release build with explicit inputs
        run: |
          set -euo pipefail
          binary="target/${RELEASE_TARGET}/release/eplyx"
          "$binary" bundle verify --bundle deploy/bundle
          "$binary" ci check \
            --bundle deploy/bundle \
            --candidate deploy/bundle/binaries/current.so \
            --format json \
            --out "$RUNNER_TEMP/release-control.json"
          python3 - "$RUNNER_TEMP/release-control.json" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["summary"]["exit_code"] == 0, report
          assert report["summary"]["passed"] is True, report
          assert report["findings"] == [], report
          PY

      - name: Package, checksum, and test the external-user path
        id: package
        env:
          ARCHIVE: ${{ steps.identity.outputs.archive }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          binary="target/${RELEASE_TARGET}/release/eplyx"
          stage="$RUNNER_TEMP/eplyx-stage"
          dist="$RUNNER_TEMP/eplyx-dist"
          user_dir="$RUNNER_TEMP/eplyx-user"
          mkdir -p "$stage" "$dist" "$user_dir"

          cp "$binary" "$stage/eplyx"
          chmod 755 "$stage/eplyx"
          tar -C "$stage" -czf "$dist/$ARCHIVE" eplyx
          [[ "$(tar -tzf "$dist/$ARCHIVE")" == "eplyx" ]]

          cd "$dist"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          shasum -a 256 -c "$ARCHIVE.sha256"

          cp "$ARCHIVE" "$ARCHIVE.sha256" "$user_dir/"
          cd "$user_dir"
          shasum -a 256 -c "$ARCHIVE.sha256"
          tar -xzf "$ARCHIVE"
          test ! -e .eplyx
          ./eplyx version --json > release-version.json
          ./eplyx --help > /dev/null
          ./eplyx bundle verify --bundle "$GITHUB_WORKSPACE/deploy/bundle"
          ./eplyx ci check \
            --bundle "$GITHUB_WORKSPACE/deploy/bundle" \
            --candidate "$GITHUB_WORKSPACE/deploy/bundle/binaries/current.so" \
            --format json \
            --out release-control.json

          python3 - release-version.json release-control.json "$PACKAGE_VERSION" "$GITHUB_SHA" "$RELEASE_TARGET" <<'PY'
          import json
          import pathlib
          import sys

          version = json.loads(pathlib.Path(sys.argv[1]).read_text())
          control = json.loads(pathlib.Path(sys.argv[2]).read_text())
          expected_version, expected_commit, expected_target = sys.argv[3:]
          assert version["version"] == expected_version, version
          assert version["commit"] == expected_commit, version
          assert version["target"] == expected_target, version
          assert control["summary"]["exit_code"] == 0, control
          assert control["summary"]["passed"] is True, control
          assert control["findings"] == [], control
          PY

      - name: Upload packaged CLI
        uses: actions/upload-artifact@v4
        with:
          name: eplyx-${{ steps.identity.outputs.release_tag }}-${{ env.RELEASE_TARGET }}
          path: |
            ${{ runner.temp }}/eplyx-dist/${{ steps.identity.outputs.archive }}
            ${{ runner.temp }}/eplyx-dist/${{ steps.identity.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build_and_package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: eplyx-${{ needs.build_and_package.outputs.release_tag }}-aarch64-apple-darwin
          path: dist

      - name: Create or update the tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ needs.build_and_package.outputs.archive }}
          RELEASE_TAG: ${{ needs.build_and_package.outputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "$RELEASE_TAG" ]]
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/$ARCHIVE" \
              "dist/$ARCHIVE.sha256" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/$ARCHIVE" \
              "dist/$ARCHIVE.sha256" \
              --verify-tag \
              --generate-notes \
              --title "Eplyx $RELEASE_TAG"
          fi
