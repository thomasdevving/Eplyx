# Measure a candidate build against the project's active Eplyx bundle.
#
# The credential here is a *project* token. It can submit checks for its own
# project and read that project's runs, and it can do nothing else: it cannot
# create a project, install a bundle, or activate one. That is the point. A
# token that lives in a pull request must not be able to change what future
# pull requests are measured against, so a passing run never moves the
# baseline — promoting a build is an operator action taken elsewhere.
#
# There is no GitHub App and no operator token. One secret and two variables:
#
#   EPLYX_API_URL     repository variable: hosted API/public origin
#   EPLYX_PROJECT_ID  repository variable: project to measure against
#   EPLYX_TOKEN       repository secret: project token
#
name: Eplyx upgrade check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate:
        description: Path to a prebuilt candidate .so, instead of building one
        required: false

permissions:
  contents: read

jobs:
  upgrade-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Candidate code is built here, never by Eplyx. The service receives
      # bytes and executes them inside the replay VM the engine sandboxes; it
      # never clones a repository and never runs a build.
      - name: Install the pinned SBF build tool
        if: inputs.candidate == ''
        run: cargo install cargo-build-sbf --version 4.4.0 --locked

      - name: Build the candidate
        if: inputs.candidate == ''
        run: ./scripts/build-stake-pool-candidate.sh

      - name: Choose the candidate binary
        id: candidate
        env:
          PROVIDED_CANDIDATE: ${{ inputs.candidate }}
        run: |
          path="$PROVIDED_CANDIDATE"
          [ -n "$path" ] || path=artifacts/fixture_stake_pool_v2.so
          [ -f "$path" ] || { echo "no candidate at $path" >&2; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"
          # The client hashes and checks the submitted bytes.

      - name: Submit to Eplyx and wait for the verdict
        id: eplyx
        env:
          EPLYX_TOKEN: ${{ secrets.EPLYX_TOKEN }}
          EPLYX_API_URL: ${{ vars.EPLYX_API_URL }}
          EPLYX_PROJECT_ID: ${{ vars.EPLYX_PROJECT_ID }}
          CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: |
          set +e
          ./scripts/eplyx-submit.sh \
            --api "$EPLYX_API_URL" \
            --project "$EPLYX_PROJECT_ID" \
            --candidate "$CANDIDATE_PATH" \
            ${{ hashFiles('.eplyx/expected-changes.toml') != '' && '--expectations .eplyx/expected-changes.toml' || '' }} \
            --report-json eplyx-report.json \
            --report-md eplyx-report.md \
            --summary eplyx-summary.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Write the job summary
        if: always()
        run: cat eplyx-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eplyx-evidence
          path: |
            eplyx-report.json
            eplyx-report.md
            eplyx-summary.md
          if-no-files-found: warn

      # The job's result is the gate's result. 0-5 are Eplyx's own exit codes;
      # 75 means execution produced no verdict; 76 means project setup blocked
      # submission; 70 means transport, input or identity verification failed.
      - name: Apply the gate result
        run: |
          code="${{ steps.eplyx.outputs.exit }}"
          case "$code" in
            0) echo "Eplyx check passed against the project's active production-derived replay bundle." ;;
            1) echo "::error::Unexpected or over-bound semantic changes detected." ;;
            2) echo "::error::Eplyx could not evaluate the candidate (configuration, fidelity or missing semantic coverage)." ;;
            3) echo "::error::A declaration in expected-changes.toml no longer describes anything." ;;
            4) echo "::error::The candidate is incompatible with the project's active bundle." ;;
            5) echo "::error::A declaration cannot be evaluated by this corpus." ;;
            75) echo "::error::The hosted run ended without a verdict. This is not a statement about the candidate." ;;
            76) echo "::error::The Eplyx project is not ready; see the step summary for setup actions." ;;
            *) echo "::error::Eplyx integration error; the reported result could not be trusted." ;;
          esac
          exit "$code"
