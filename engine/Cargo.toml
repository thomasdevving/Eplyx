[package]
name = "eplyx-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic differential execution and impact analysis for Solana program upgrades."

[[bin]]
name = "eplyx"
path = "src/main.rs"

[dependencies]
fixture-lending-interface = { workspace = true }
borsh = { workspace = true }
litesvm = { workspace = true }
solana-account = { workspace = true }
# `curve25519` enables host-side PDA derivation; `std` enables base58 parsing.
solana-address = { workspace = true, features = ["curve25519", "std"] }
solana-clock = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-rent = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-error = { workspace = true }
solana-instruction-error = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
base64 = "0.22.1"
bs58 = "0.5.1"
sha2 = "0.10.9"
wincode = "0.5.5"
solana-hash = { workspace = true }

[dev-dependencies]
tempfile = "3"
