[package]
name = "fixture-stake-pool-rollout-candidate"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Constructed rollout counterexample Stake Pool test fixture; not an upstream release; not intended for deployment."

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
custom-heap = []
custom-panic = []
no-entrypoint = []

[dependencies]
borsh = "=1.8.1"
solana-program = "=2.3.0"
solana-system-interface = { version = "=1.0.0", features = ["bincode"] }
spl-stake-pool = { version = "=2.0.3", features = ["no-entrypoint"] }
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
codegen-units = 1
